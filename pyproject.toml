[project]
name = "ds-aa-uga-flooding"
version = "0.1.0"
description = "Anticipatory action for flooding in Uganda — trigger design across four zones"
requires-python = ">=3.11"
dependencies = [
    "ocha-stratus>=0.1.7",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "geopandas>=1.0.0",
    "shapely>=2.0",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "xarray>=2024.6",
    "exactextract>=0.3.0",
    "matplotlib>=3.10.0",
    "scipy>=1.13.0",
    "tqdm>=4.66.0",
    "pyarrow>=17",
    "openpyxl>=3.1.5",
    "cdsapi>=0.7.7",
    "netcdf4>=1.7.2",
    "requests>=2.32",
    "marimo>=0.16.0",
    "contextily>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
